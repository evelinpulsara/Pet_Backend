openapi: 3.0.3
info:
  title: PetTracker API
  version: 1.0.0
  description: |
    Contrato del API de PetTracker (Contract-First / Single Source of Truth).

    La base de datos vive en Supabase (esquema `pettracker`) y se expone con
    PostgREST (REST) y funciones RPC. Este archivo describe lo que usan:
      - el COLLAR GPS (por ejemplo un Arduino con Wi-Fi o GSM): `report_location`
      - la APP: mascotas y su historial de ubicaciones

    Reglas comunes:
      - Header `apikey`: la clave PÚBLICA (publishable) del proyecto.
      - Header `Content-Profile: pettracker` (escritura/RPC) o
        `Accept-Profile: pettracker` (lectura) para elegir el esquema.
      - La app además envía `Authorization: Bearer <token de sesión>`;
        Row Level Security hace que cada dueño vea solo lo suyo.
servers:
  - url: https://zcsfkltvilypjxocoojz.supabase.co/rest/v1
    description: Supabase (proyecto compartido; PetTracker usa el esquema pettracker)

tags:
  - name: Collar
    description: Lo que llama el dispositivo GPS.
  - name: App
    description: Lo que usa la app del dueño.

paths:
  /rpc/report_location:
    post:
      tags: [Collar]
      summary: El collar envía su ubicación actual
      description: |
        RPC: se llama como una función remota. No requiere usuario; el collar se
        identifica con su código (`p_device_uid`) y su clave secreta (`p_device_key`),
        que el dueño configura en la app (Mi collar → Clave del collar GPS).
        Al guardarla, la app se entera al instante por WebSocket (Supabase Realtime).
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ContentProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportLocationRequest' }
            example:
              p_device_uid: TRK-1001
              p_device_key: clave-secreta-123
              p_lat: 1.2136
              p_lon: -77.2811
              p_accuracy: 5
              p_battery: 87
      responses:
        '200':
          description: Ubicación guardada. Devuelve el número del registro.
          content:
            application/json:
              schema: { type: integer, format: int64, example: 1024 }
        '400':
          description: Collar no autorizado (código o clave incorrectos) o datos fuera de rango.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: P0001, message: Collar no autorizado }

  /rpc/set_device_key:
    post:
      tags: [App]
      summary: El dueño le asigna la clave secreta a su collar
      security:
        - apiKey: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_device_uid, p_key]
              properties:
                p_device_uid: { type: string, example: TRK-1001 }
                p_key: { type: string, minLength: 12, example: clave-secreta-123 }
      responses:
        '204': { description: Clave guardada (solo se guarda su hash SHA-256). }
        '400':
          description: Collar no encontrado o no es del usuario, o clave muy corta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pets:
    get:
      tags: [App]
      summary: Mascotas del usuario que inició sesión
      description: |
        REST orientado a recursos. Con `select` el cliente pide solo las columnas
        que necesita (evita over-fetching) e incluye el collar en la misma
        petición (evita un segundo round-trip).
      security:
        - apiKey: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptProfile'
        - name: select
          in: query
          schema: { type: string, example: 'id,name,species,tracker_devices(device_uid)' }
      responses:
        '200':
          description: Lista de mascotas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
        '401':
          description: Sin sesión (Row Level Security niega el acceso).

  /location_history:
    get:
      tags: [App]
      summary: Historial de ubicaciones de una mascota
      security:
        - apiKey: []
          bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptProfile'
        - name: pet_id
          in: query
          required: true
          schema: { type: string, example: 'eq.3f2b6c1e-...' }
        - name: order
          in: query
          schema: { type: string, example: 'recorded_at.desc' }
        - name: limit
          in: query
          schema: { type: integer, example: 300 }
      responses:
        '200':
          description: Ubicaciones (la app las valida antes de usarlas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocationRow' }

components:
